# Apriori fixture map: where CAD or a survey says the fixtures are.
#
# Positions are in the `frame_id` below, metres. These are AUTHORITATIVE. The
# node never overwrites them from observation -- when an observation disagrees
# by more than confirm_radius, the landmark is FLAGGED (red in RViz, a warn in
# the log, a max_residual in the output map) and a human decides whether the
# drawing or the estimator is wrong.
#
# The class strings here must match the keys in fixture_classes.yaml and the
# YOLO class_id strings, exactly. Association is within-class, so a class
# mismatch here means the CAD entry can never be confirmed by anything.
#
# sigma is the 1-sigma position uncertainty of the SURVEY, not of the camera.
# For a CAD position on a rigid panel a centimetre or two is realistic; if you
# paced it out, say so and put 0.1 in.
#
# Replace both entries below with your measured fixture positions.

frame_id: map

landmarks:
#[into/out of frame, l/r translation, up/down translation] in metres 
#i am setting the datum to be the center of the boards face, camera will be positioned 0.40m away from board at the center

  - id: wheel_cad_01
    class: wheel
    position: [-0.06, -0.21, 0.22]   # PLACEHOLDER: 0.44 m ahead of the map origin,
    origin: apriori 
    sigma: 0.01

  - id: eva_handle_cad_01
    class: eva_handle
    position: [-0.06, 0.21, 0.22]
    origin: apriori
    sigma: 0.01

  - id: handle_cad_01
    class: handle
    position: [-0.06, 0.0, 0.24]
    origin: apriori
    sigma: 0.01

  - id: snowflake_cad_01
    class: snowflake
    position: [-0.1, 0.14, 0.0]
    origin: apriori
    sigma: 0.01

  - id: marman_ring_cad_01
    class: marman_ring
    position: [-0.06, -0.14, 0.0]
    origin: apriori
    sigma: 0.01
   
  - id: rocket_nozzle_cad_01
    class: rocket_nozzle
    position: [-0.07, 0.22, -0.22]
    origin: apriori
    sigma: 0.01

  - id: oblique_knob_cad_01
    class: oblique_knob
    position: [-0.1, -0.2, -0.22]
    origin: apriori
    sigma: 0.01

  - id: knob_cad_01
    class: knob
    position: [-0.07, 0.0, -0.22] 
    origin: apriori
    sigma: 0.01